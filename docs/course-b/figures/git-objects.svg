<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img">
  <title>Git 对象和分支指针</title>
  <style>text { font-family: sans-serif; font-size: 14px; fill: #1f2430; } .box { fill: #f4f6fb; stroke: #3451b2; }</style>
  <rect class="box" x="16" y="48" width="150" height="64" rx="8"/>
  <text x="91" y="74" text-anchor="middle" font-weight="700">blob</text>
  <text x="91" y="96" text-anchor="middle">price = 18</text>
  <rect class="box" x="210" y="48" width="160" height="64" rx="8"/>
  <text x="290" y="74" text-anchor="middle" font-weight="700">tree</text>
  <text x="290" y="96" text-anchor="middle">menu.py</text>
  <rect class="box" x="414" y="48" width="170" height="64" rx="8"/>
  <text x="499" y="74" text-anchor="middle" font-weight="700">commit</text>
  <text x="499" y="96" text-anchor="middle">add menu price</text>
  <rect class="box" x="620" y="20" width="120" height="40" rx="8"/>
  <text x="680" y="46" text-anchor="middle" font-weight="700">master</text>
  <path d="M166 80 H210 M370 80 H414 M584 70 H620" stroke="#3451b2" fill="none" stroke-width="2"/>
  <text x="16" y="160">分支不是对象。它是指向 commit 的名字。</text>
</svg>
