<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img">
  <title>anon key 在三种 RLS 状态下能读到的行</title>
  <style>text { font-family: sans-serif; font-size: 14px; fill: #1f2430; } .box { fill: #f4f6fb; stroke: #3451b2; }</style>
  <rect class="box" x="16" y="20" width="230" height="150" rx="8"/>
  <text x="28" y="48" font-weight="700">RLS 关闭</text>
  <text x="28" y="84">Ada 的备注</text>
  <text x="28" y="110">Bo 的备注</text>
  <text x="28" y="146">两行都回来</text>
  <rect class="box" x="266" y="20" width="230" height="150" rx="8"/>
  <text x="278" y="48" font-weight="700">RLS 开，无策略</text>
  <text x="278" y="100">空数组</text>
  <rect class="box" x="516" y="20" width="228" height="150" rx="8"/>
  <text x="528" y="48" font-weight="700">只允许本人</text>
  <text x="528" y="84">anon：仍是空</text>
  <text x="528" y="116">登录后只见自己</text>
</svg>
