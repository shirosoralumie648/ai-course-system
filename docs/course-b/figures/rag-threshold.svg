<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img">
  <title>三条问题在两个阈值下的结果</title>
  <style>text { font-family: sans-serif; font-size: 14px; fill: #1f2430; } .ok { fill: #3451b2; } .no { fill: #fff; stroke: #3451b2; }</style>
  <text x="16" y="28" font-weight="700">分数是那组六维向量的余弦。</text>
  <text x="300" y="64">阈值 0.0</text>
  <text x="520" y="64">阈值 0.3</text>
  <text x="16" y="100">公司创立</text>
  <rect class="ok" x="300" y="82" width="150" height="28"/>
  <text x="312" y="101" fill="#fff">A 0.9992</text>
  <rect class="ok" x="520" y="82" width="140" height="28"/>
  <text x="536" y="101" fill="#fff">同样命中</text>
  <text x="16" y="146">吃苹果</text>
  <rect class="ok" x="300" y="128" width="150" height="28"/>
  <text x="312" y="147" fill="#fff">B 0.9985</text>
  <rect class="ok" x="520" y="128" width="140" height="28"/>
  <text x="536" y="147" fill="#fff">同样命中</text>
  <text x="16" y="192">天气</text>
  <rect class="no" x="300" y="174" width="180" height="28"/>
  <text x="308" y="193">C 0.0232 仍进入</text>
  <rect class="no" x="520" y="174" width="100" height="28"/>
  <text x="548" y="193">拒答</text>
</svg>
